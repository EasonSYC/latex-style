name: Setup eason.sty

on:
  workflow_call:

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Setup LaTeX
    steps:

    - name: Checkout latex-style
      uses: actions/checkout@v6
      with:
        repository: EasonSYC/latex-style
        path: latex-style
    
    - name: Install TeX Live
      uses: zauguin/install-texlive@v4
      with:
        package_file: ${{ github.workspace }}/latex-style/.github/texlive.packages
